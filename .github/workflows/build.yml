name: build-static

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SDL_VERSION: 2.32.10
      SDL_SHA256: 5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxrender-dev \
            libxcursor-dev libxfixes-dev libxss-dev libxkbcommon-dev

      - name: Build static SDL2
        run: |
          sources=(
            "https://libsdl.org/release/SDL2-${SDL_VERSION}.tar.gz"
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz"
          )
          for url in "${sources[@]}"; do
            rm -f sdl2.tar.gz
            echo "Downloading SDL2 from $url"
            curl -fL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
              "$url" -o sdl2.tar.gz || continue
            if echo "$SDL_SHA256  sdl2.tar.gz" | sha256sum -c - >/dev/null; then
              echo "Download OK from $url"
              break
            else
              echo "Checksum mismatch from $url, trying next source"
              rm -f sdl2.tar.gz
            fi
          done
          test -s sdl2.tar.gz || { echo "::error::could not download SDL2 from any source"; exit 1; }
          tar xzf sdl2.tar.gz
          cmake -S "SDL2-${SDL_VERSION}" -B build-sdl -G Ninja \
            -DSDL_STATIC=ON -DSDL_SHARED=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_AUDIO=OFF -DSDL_JOYSTICK=OFF -DSDL_HAPTIC=OFF \
            -DSDL_HIDAPI=OFF -DSDL_SENSOR=OFF \
            -DSDL_X11=ON -DSDL_WAYLAND=OFF -DSDL_DBUS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl-prefix"
          cmake --build build-sdl --target install
          test -f "$GITHUB_WORKSPACE/sdl-prefix/include/SDL2/SDL.h"
          test -f "$GITHUB_WORKSPACE/sdl-prefix/lib/pkgconfig/sdl2.pc"

      - name: Compile paint (static SDL)
        run: |
          test -f "$GITHUB_WORKSPACE/sdl-prefix/lib/pkgconfig/sdl2.pc"
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/sdl-prefix/lib/pkgconfig"
          g++ -std=c++23 -O2 -static-libgcc -static-libstdc++ -Isrc -o paint \
            paint.cpp src/app/app.cpp src/app/render.cpp \
            src/io/input.cpp src/draw/draw.cpp \
            src/draw/canvas.cpp src/io/bmp.cpp \
            $(pkg-config --static --cflags --libs sdl2)

      - name: Verify no SDL or C++ runtime dependency
        run: |
          file paint
          if ldd paint | grep -iE 'sdl|stdc\+\+|gcc_s'; then
            echo "::error::binary still depends on SDL or the C++ runtime"
            exit 1
          fi
          echo "OK - libSDL2 and the C++ runtime are statically linked"

      - name: Smoke test (headless)
        run: |
          mkdir -p dist
          cp paint dist/
          cp -r assets images dist/
          (cd dist && SDL_VIDEODRIVER=offscreen PAINT_SMOKE_TEST=1 timeout 30 ./paint)
          echo "smoke test passed"

      - name: Package artifact
        run: tar -C dist -czf paint-linux-static.tar.gz paint assets images

      - uses: actions/upload-artifact@v4
        with:
          name: paint-linux-static
          path: paint-linux-static.tar.gz
