name: build-static

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SDL_VERSION: 3.4.14
      SDL_SHA256: 30d4aa2b3037718142b32dffd4e72f917ebb6cc5227150e7bb9c45efb2153aeb
      TTF_VERSION: 3.2.2
      TTF_SHA256: 63547d58d0185c833213885b635a2c0548201cc8f301e6587c0be1a67e1e045d

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxrender-dev \
            libxcursor-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev

      - name: Build static SDL3
        run: |
          sources=(
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          )
          for url in "${sources[@]}"; do
            rm -f sdl3.tar.gz
            echo "Downloading SDL3 from $url"
            curl -fL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
              "$url" -o sdl3.tar.gz || continue
            if echo "$SDL_SHA256  sdl3.tar.gz" | sha256sum -c - >/dev/null; then
              echo "Download OK from $url"
              break
            else
              echo "Checksum mismatch from $url, trying next source"
              rm -f sdl3.tar.gz
            fi
          done
          test -s sdl3.tar.gz || { echo "::error::could not download SDL3 from any source"; exit 1; }
          tar xzf sdl3.tar.gz
          cmake -S "SDL3-${SDL_VERSION}" -B build-sdl -G Ninja \
            -DSDL_STATIC=ON -DSDL_SHARED=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_AUDIO=OFF -DSDL_JOYSTICK=OFF -DSDL_HAPTIC=OFF \
            -DSDL_HIDAPI=OFF -DSDL_SENSOR=OFF \
            -DSDL_X11=ON -DSDL_WAYLAND=OFF -DSDL_DBUS=OFF \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl-prefix"
          cmake --build build-sdl --target install
          test -f "$GITHUB_WORKSPACE/sdl-prefix/include/SDL3/SDL.h"
          test -f "$GITHUB_WORKSPACE/sdl-prefix/lib/pkgconfig/sdl3.pc"

      - name: Build static SDL3_ttf
        run: |
          sources=(
            "https://github.com/libsdl-org/SDL_ttf/releases/download/release-${TTF_VERSION}/SDL3_ttf-${TTF_VERSION}.tar.gz"
          )
          for url in "${sources[@]}"; do
            rm -f sdl3ttf.tar.gz
            echo "Downloading SDL3_ttf from $url"
            curl -fL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
              "$url" -o sdl3ttf.tar.gz || continue
            if echo "$TTF_SHA256  sdl3ttf.tar.gz" | sha256sum -c - >/dev/null; then
              echo "Download OK from $url"
              break
            else
              echo "Checksum mismatch from $url, trying next source"
              rm -f sdl3ttf.tar.gz
            fi
          done
          test -s sdl3ttf.tar.gz || { echo "::error::could not download SDL3_ttf from any source"; exit 1; }
          tar xzf sdl3ttf.tar.gz
          (cd "SDL3_ttf-${TTF_VERSION}/external" && ./download.sh)
          cmake -S "SDL3_ttf-${TTF_VERSION}" -B build-ttf -G Ninja \
            -DBUILD_SHARED_LIBS=OFF \
            -DSDLTTF_VENDORED=ON \
            -DSDLTTF_SAMPLES=OFF \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/sdl-prefix" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl-prefix"
          cmake --build build-ttf --target install
          test -f "$GITHUB_WORKSPACE/sdl-prefix/lib/pkgconfig/sdl3-ttf.pc"

      - name: Compile paint (static SDL)
        run: |
          test -f "$GITHUB_WORKSPACE/sdl-prefix/lib/pkgconfig/sdl3-ttf.pc"
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/sdl-prefix/lib/pkgconfig"
          g++ -std=c++23 -O2 -static-libgcc -static-libstdc++ -Isrc -o paint \
            paint.cpp src/app/app.cpp src/app/render.cpp \
            src/io/input.cpp src/draw/draw.cpp \
            src/draw/canvas.cpp src/io/bmp.cpp \
            $(pkg-config --static --cflags --libs sdl3-ttf)

      - name: Verify no SDL or C++ runtime dependency
        run: |
          file paint
          if ldd paint | grep -iE 'sdl|stdc\+\+|gcc_s'; then
            echo "::error::binary still depends on SDL or the C++ runtime"
            exit 1
          fi
          echo "OK - libSDL3, libSDL3_ttf and the C++ runtime are statically linked"

      - name: Smoke test (headless)
        run: |
          mkdir -p dist
          cp paint dist/
          cp -r assets images dist/
          (cd dist && SDL_VIDEODRIVER=offscreen PAINT_SMOKE_TEST=1 timeout 30 ./paint)
          echo "smoke test passed"

      - name: Package artifact
        run: tar -C dist -czf paint-linux-static.tar.gz paint assets images

      - uses: actions/upload-artifact@v4
        with:
          name: paint-linux-static
          path: paint-linux-static.tar.gz
